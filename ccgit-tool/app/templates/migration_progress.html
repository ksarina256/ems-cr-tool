{% extends "base.html" %}
{% block title %}Migration In Progress{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Migration Running</h1>
  <span class="page-sub">Job ID: {{ job_id }}</span>
</div>

<section class="card">
  <div class="progress-container">
    <div class="spinner"></div>
    <p id="status-msg" class="status-msg">Migration in progress — please wait...</p>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div id="result-area" class="result-area hidden"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
  const jobId = "{{ job_id }}";
  const statusMsg = document.getElementById("status-msg");
  const progressBar = document.getElementById("progress-bar");
  const resultArea = document.getElementById("result-area");

  const messages = [
    "Connecting to ClearCase environment...",
    "Extracting files from VOB...",
    "Normalising paths...",
    "Initialising Git repository...",
    "Committing migrated files...",
    "Running validation checks...",
    "Generating migration report..."
  ];
  let msgIdx = 0;

  const msgInterval = setInterval(() => {
    if (msgIdx < messages.length) {
      statusMsg.textContent = messages[msgIdx++];
    }
  }, 2500);

  let pct = 5;
  const barInterval = setInterval(() => {
    if (pct < 90) { pct += 3; progressBar.style.width = pct + "%"; }
  }, 1200);

  function poll() {
    fetch(`/migration/status/${jobId}`)
      .then(r => r.json())
      .then(data => {
        if (data.status === "done") {
          clearInterval(msgInterval);
          clearInterval(barInterval);
          progressBar.style.width = "100%";
          window.location.href = `/migration/results/${jobId}`;
        } else {
          setTimeout(poll, 2000);
        }
      })
      .catch(() => setTimeout(poll, 3000));
  }

  setTimeout(poll, 2000);
</script>
{% endblock %}
